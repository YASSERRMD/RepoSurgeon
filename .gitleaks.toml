title = "RepoSurgeon gitleaks configuration"

# Extend the default rule set; this file only narrows known false-positive
# sources that contain deliberately non-secret credential material. A single
# [allowlist] section is used because the gitleaks version installed by the
# GitHub action (8.24.x) does not honour [[allowlists]] blocks.
[extend]
useDefault = true

[allowlist]
description = "Deliberately non-secret credential fixtures in tests and CI"
paths = [
    '''internal/redact/redact_test\.go$''',
    '''\.github/workflows/compose-smoke\.yml$''',
    '''web/src/api/client\.test\.ts$''',
]
