                      $ref: '#/components/schemas/Check'
        '400':
          description: Unknown profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: validation_failed
                  message: unknown command profile rm -rf /
                  request_id: req_0123456789abcdef
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Check service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listChecks
      summary: List checks recorded for a run
      tags: [checks]
      responses:
        '200':
          description: Check results, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [run_id, project_id, items]
                properties:
                  run_id:
                    type: string
                  project_id:
                    type: string
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Check'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/runs/{run_id}/checks/{check_id}/logs:
