          type: string
        name:
          type: string
        kind:
          type: string
          enum: [func, type, const, var, class, def, interface, other]
        line:
          type: integer
        signature:
          type: string
        exported:
          type: boolean

    IndexedFile:
      type: object
      required: [path, language, size_bytes, line_count, sha256, indexed_at]
      properties:
