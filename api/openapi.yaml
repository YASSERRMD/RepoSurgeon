openapi: 3.1.0
info:
  title: RepoSurgeon API
  version: 0.16.0
  summary: RepoSurgeon autonomous software engineering workspace
  description: |
    RepoSurgeon connects authorized GitHub repositories to an autonomous
    engineering agent. This document is the contract of record: the server
    implementation and the generated Vue client must both match it, and CI
    fails on drift (`npm run gen:client` output must be committed).

    Conventions:
    - All mutating calls require an `Idempotency-Key` header.
    - `X-Request-ID` is accepted and echoed on every response.
    - Cursor pagination uses `{ "items": [...], "next_cursor": "..." }`.
    - Failures use the canonical `Error` envelope with a stable `code`.
    - Organization and project scoping is enforced on every request; a caller
      never receives another organization's records.

    Authentication (M02): browsers authenticate with `POST /api/v1/auth/login`
    and receive an opaque session cookie. Mutating browser requests also need
    the `X-CSRF-Token` header returned by login/refresh. Server-to-server
    callers may send `Authorization: Bearer <session token>` instead.
servers:
  - url: http://localhost:8081
    description: Local API (docker compose / make dev)
  - url: http://localhost:8080
    description: Same-origin behind the web proxy

tags:
  - name: health
    description: Process liveness and readiness
  - name: system
    description: Service metadata
  - name: auth
    description: Sessions, login and logout
  - name: members
    description: Organization membership and roles
  - name: credentials
    description: Encrypted provider credentials
  - name: organizations
    description: Tenant isolation boundary
  - name: projects
    description: Workspaces inside an organization
  - name: audit
    description: Append-only activity trail
  - name: model
    description: Step 5 Preview model gateway
  - name: github
    description: GitHub App integration and issue import
  - name: webhooks
    description: GitHub webhook intake
  - name: workspaces
    description: Pinned checkouts and worktrees
  - name: runs
    description: Durable agent runs
  - name: tools
    description: Tool catalog, policy and approvals
  - name: context
    description: Repository index and context builder
  - name: plans
    description: Typed investigation plans and approvals
  - name: patches
    description: Atomic code changes and checkpoints
  - name: checks
    description: Test discovery, execution and evidence
  - name: recovery
    description: Bounded retries, loop detection and rollback
  - name: pull_requests
    description: Git commits, pull requests, CI review and safe merge
  - name: console
    description: Workbench dashboard metrics and operator view settings

paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Liveness probe
      description: |
        Returns 200 whenever the process is serving. Liveness never depends on
        external systems.
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveStatus'
              example:
                status: ok
                uptime_seconds: 12.5
        '500':
          $ref: '#/components/responses/InternalError'

  /health/ready:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Returns 200 only when the database is reachable and no critical
        migration is pending. Returns 503 with per-check detail otherwise; the
        response is safe to show to operators and never contains credentials.
      security: []
      responses:
        '200':
          description: Service is ready to accept traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessReport'
              example:
                status: ready
                checks:
                  - name: database
                    status: up
                    duration_ms: 2
                  - name: migrations
                    status: up
                    duration_ms: 3
                generated_at: '2026-10-10T10:00:00Z'
        '503':
          description: Service is not ready. Each failing check explains the remediation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessReport'

  /api/v1/system/info:
    get:
      operationId: getSystemInfo
      summary: Running service metadata
      security: []
      responses:
        '200':
          description: Service metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/organizations:
    get:
      operationId: listOrganizations
      summary: List organizations the caller belongs to
      tags: [organizations]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of organizations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
              example:
                items:
                  - id: org_2f8s8k4m2c9v0a1b3d5e7f9g1h
                    slug: acme-engineering
                    name: Acme Engineering
                    role: owner
                    created_at: '2026-10-10T10:00:00Z'
                    updated_at: '2026-10-10T10:00:00Z'
                next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createOrganization
      summary: Create an organization
      description: |
        The caller becomes an owner of the new organization. Requires an
        `Idempotency-Key`; repeating the key returns the created organization.
      tags: [organizations]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationCreate'
            example:
              name: Acme Engineering
              slug: acme-engineering
      responses:
        '201':
          description: Organization created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List projects in an organization
      tags: [projects]
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
          description: Organization whose projects are listed; the caller must belong to it.
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of projects, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
              example:
                items:
                  - id: prj_7h2k9m4q8w3e6r1t5y0u2i4o6p
                    organization_id: org_2f8s8k4m2c9v0a1b3d5e7f9g1h
                    name: billing-service
                    description: Payments and invoicing
                    version: 3
                    created_at: '2026-10-10T10:00:00Z'
                    updated_at: '2026-10-10T11:30:00Z'
                next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createProject
      summary: Create a project
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
            example:
              organization_id: org_2f8s8k4m2c9v0a1b3d5e7f9g1h
              name: billing-service
              description: Payments and invoicing
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      summary: Get one project
      tags: [projects]
      responses:
        '200':
          description: Project detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateProject
      summary: Update project name, description or settings
      description: |
        Optimistic concurrency: send the `version` you last read. The server
        only applies the change when the stored version still matches, and
        returns 409 with the current version when it does not.
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
            example:
              version: 3
              description: Payments, invoicing and refunds
      responses:
        '200':
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/audit:
    get:
      operationId: listAuditEvents
      summary: List audit events for a project
      description: |
        Append-only activity trail. Requires `project_id`; the caller must be a
        member of the owning organization.
      tags: [audit]
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
          description: Exact action filter, for example `project.created`.
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of audit events, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
              example:
                items:
                  - id: aud_9p0o8i7u6y5t4r3e2w1q
                    organization_id: org_2f8s8k4m2c9v0a1b3d5e7f9g1h
                    project_id: prj_7h2k9m4q8w3e6r1t5y0u2i4o6p
                    actor_id: usr_1a2b3c4d5e6f7g8h9i0j
                    action: project.created
                    entity_type: project
                    entity_id: prj_7h2k9m4q8w3e6r1t5y0u2i4o6p
                    request_id: req_4f2a1b3c5d6e7f8a9b0c
                    payload:
                      name: billing-service
                    sequence: 12
                    created_at: '2026-10-10T10:00:00Z'
                next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/login:
    post:
      operationId: login
      summary: Authenticate with email and password
      description: |
        Returns the authenticated user and sets the session cookie. Repeated
        failures are rate limited per email and per client address; the
        response is identical for unknown email and wrong password so it
        cannot be used to enumerate accounts.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: developer@example.com
              password: correct-horse-battery-staple
      responses:
        '200':
          description: Authentication succeeded.
          headers:
            Set-Cookie:
              description: Opaque session cookie (HttpOnly, SameSite=Strict).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              example:
                user:
                  id: usr_1a2b3c4d5e6f7g8h9i0j
                  email: developer@example.com
                  display_name: Developer
                csrf_token: csrf_9f8e7d6c5b4a
                expires_at: '2026-10-11T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials, unknown account, or rate limited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_credentials
                  message: email or password is incorrect
                  request_id: req_0123456789abcdef
        '429':
          description: Too many failed attempts; retry after the given delay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: rate_limited
                  message: too many failed login attempts; try again later
                  request_id: req_0123456789abcdef

  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      tags: [auth]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Session revoked; the cookie is cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the current session
      description: |
        Issues a new session token and revokes the previous one, so a stolen
        token is only usable until the legitimate client refreshes.
      tags: [auth]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Session rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Current user with roles and permissions
      tags: [auth]
      responses:
        '200':
          description: Authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
              example:
                id: usr_1a2b3c4d5e6f7g8h9i0j
                email: developer@example.com
                display_name: Developer
                organizations:
                  - id: org_2f8s8k4m2c9v0a1b3d5e7f9g1h
                    name: Acme Engineering
                    slug: acme-engineering
                    role: owner
                    permissions: [project.read, project.write, run.execute]
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/members:
    get:
      operationId: listMembers
      summary: List members of an organization
      tags: [members]
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Members with roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
    post:
      operationId: inviteMember
      summary: Invite a member with a role
      description: Requires the member.admin permission. Roles are validated
        server-side; untrusted content can never grant permissions.
      tags: [members]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInvite'
            example:
              organization_id: org_2f8s8k4m2c9v0a1b3d5e7f9g1h
              email: teammate@example.com
              role: maintainer
      responses:
        '201':
          description: Member created or updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/members/{membership_id}:
    parameters:
      - name: membership_id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateMemberRole
      summary: Change a member's role
      description: |
        Requires member.admin. The last owner cannot be demoted or removed,
        and a member cannot escalate their own role.
      tags: [members]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdate'
            example:
              role: reviewer
      responses:
        '200':
          description: Role updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: removeMember
      summary: Remove a member from the organization
      tags: [members]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Member removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/credentials:
    get:
      operationId: listCredentials
      summary: List credential metadata for an organization
      description: |
        Values are never returned. Each item reports kind, label, status, key
        version, fingerprint and verification state.
      tags: [credentials]
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Credential metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
    post:
      operationId: createCredential
      summary: Store an encrypted provider credential
      description: Requires credential.admin. The plaintext value is encrypted
        with envelope AEAD before it touches the database and is never
        returned, logged or exposed to model runs.
      tags: [credentials]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCreate'
            example:
              organization_id: org_2f8s8k4m2c9v0a1b3d5e7f9g1h
              kind: stepfun
              label: production keys
              value: sf-live-xxxxxxxxxxxxxxxx
      responses:
        '201':
          description: Credential stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/credentials/{credential_id}:
    parameters:
      - name: credential_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getCredential
      summary: Credential metadata (never the value)
      tags: [credentials]
      responses:
        '200':
          description: Credential metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: revokeCredential
      summary: Revoke a credential
      description: |
        Revocation destroys the ability to decrypt the stored value; the
        metadata row is retained for audit.
      tags: [credentials]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Credential revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/credentials/{credential_id}/rotate:
    post:
      operationId: rotateCredential
      summary: Replace the credential value and key version
      description: |
        The new value is encrypted; the previous ciphertext is destroyed in the
        same transaction. Unrelated credentials are untouched.
      tags: [credentials]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialRotate'
            example:
              value: sf-live-yyyyyyyyyyyyyyyy
      responses:
        '200':
          description: Credential rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'


  /api/v1/model/provider:
    get:
      operationId: getModelProvider
      summary: Model provider configuration and readiness
      description: |
        Reports the configured provider, model, base URL and whether a live key
        is present. The key itself is never returned.
      tags: [model]
      responses:
        '200':
          description: Provider configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelProviderStatus'
              example:
                configured: true
                provider: stepfun
                model: step-5-preview
                base_url: https://api.stepfun.ai/v1
                reasoning_effort: medium
                key_configured: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /api/v1/model/probe:
    post:
      operationId: probeModelProvider
      summary: Send a minimal completion to the provider
      description: |
        The only endpoint that spends provider budget. Requires
        credential.admin and returns the measured latency and token usage, or a
        mapped provider failure. The prompt is fixed server-side and never
        includes repository content.
      tags: [model]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Provider answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelProbeResult'
              example:
                provider: stepfun
                model: step-5-preview
                latency_ms: 812
                usage:
                  prompt_tokens: 9
                  cached_tokens: 0
                  completion_tokens: 1
                  total_tokens: 10
                finish_reason: stop
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '429':
          description: Provider is rate limiting this workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: provider_rate_limit
                  message: the model provider is rate limiting this workspace
                  request_id: req_0123456789abcdef
        '502':
          description: Provider error or malformed response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: provider_error
                  message: the model provider reported a server error
                  request_id: req_0123456789abcdef
        '503':
          description: No provider key configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
