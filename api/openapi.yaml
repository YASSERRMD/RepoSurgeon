  /api/v1/runs/{run_id}/checks:
    parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: runChecks
      summary: Execute verified test/build command profiles
      description: |
        Runs only registered profiles through the isolated runner. The verdict
        is derived from exit codes; a required profile that did not run or an
        unknown profile blocks the run.
      tags: [checks]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckRunRequest'
            example:
              workspace_id: wsp_1a2b3c4d5e6f7g8h9i0j
              profiles: [go.test, go.build, npm.test]
      responses:
        '201':
          description: Checks executed with a deterministic verdict.
          content:
            application/json:
              schema:
                type: object
                required: [run_id, verdict, items]
                properties:
                  run_id:
                    type: string
                  verdict:
                    type: string
                    enum: [green, red]
                  items:
                    type: array
