openapi: 3.1.0
info:
  title: RepoSurgeon API
  version: 0.6.0
  summary: RepoSurgeon autonomous software engineering workspace
  description: |
    RepoSurgeon connects authorized GitHub repositories to an autonomous
    engineering agent. This document is the contract of record: the server
    implementation and the generated Vue client must both match it, and CI
    fails on drift (`npm run gen:client` output must be committed).

    Conventions:
    - All mutating calls require an `Idempotency-Key` header.
    - `X-Request-ID` is accepted and echoed on every response.
    - Cursor pagination uses `{ "items": [...], "next_cursor": "..." }`.
    - Failures use the canonical `Error` envelope with a stable `code`.
    - Organization and project scoping is enforced on every request; a caller
      never receives another organization's records.

    Authentication (M02): browsers authenticate with `POST /api/v1/auth/login`
    and receive an opaque session cookie. Mutating browser requests also need
    the `X-CSRF-Token` header returned by login/refresh. Server-to-server
    callers may send `Authorization: Bearer <session token>` instead.
servers:
  - url: http://localhost:8081
    description: Local API (docker compose / make dev)
  - url: http://localhost:8080
    description: Same-origin behind the web proxy

tags:
  - name: health
    description: Process liveness and readiness
  - name: system
    description: Service metadata
  - name: auth
    description: Sessions, login and logout
  - name: members
    description: Organization membership and roles
  - name: credentials
    description: Encrypted provider credentials
  - name: organizations
    description: Tenant isolation boundary
  - name: projects
    description: Workspaces inside an organization
  - name: audit
    description: Append-only activity trail
  - name: model
    description: Step 5 Preview model gateway
  - name: github
    description: GitHub App integration and issue import
  - name: webhooks
    description: GitHub webhook intake
  - name: workspaces
    description: Pinned checkouts and worktrees

paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Liveness probe
      description: |
        Returns 200 whenever the process is serving. Liveness never depends on
        external systems.
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveStatus'
              example:
                status: ok
                uptime_seconds: 12.5
        '500':
          $ref: '#/components/responses/InternalError'

  /health/ready:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Returns 200 only when the database is reachable and no critical
        migration is pending. Returns 503 with per-check detail otherwise; the
        response is safe to show to operators and never contains credentials.
      security: []
      responses:
        '200':
          description: Service is ready to accept traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessReport'
              example:
                status: ready
                checks:
                  - name: database
                    status: up
                    duration_ms: 2
                  - name: migrations
                    status: up
                    duration_ms: 3
                generated_at: '2026-10-10T10:00:00Z'
        '503':
          description: Service is not ready. Each failing check explains the remediation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessReport'

  /api/v1/system/info:
    get:
      operationId: getSystemInfo
      summary: Running service metadata
      security: []
      responses:
        '200':
          description: Service metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/organizations:
    get:
      operationId: listOrganizations
      summary: List organizations the caller belongs to
      tags: [organizations]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of organizations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
              example:
                items:
                  - id: org_2f8s8k4m2c9v0a1b3d5e7f9g1h
                    slug: acme-engineering
                    name: Acme Engineering
                    role: owner
                    created_at: '2026-10-10T10:00:00Z'
                    updated_at: '2026-10-10T10:00:00Z'
                next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createOrganization
      summary: Create an organization
      description: |
        The caller becomes an owner of the new organization. Requires an
        `Idempotency-Key`; repeating the key returns the created organization.
      tags: [organizations]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationCreate'
            example:
              name: Acme Engineering
              slug: acme-engineering
      responses:
        '201':
          description: Organization created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List projects in an organization
      tags: [projects]
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
          description: Organization whose projects are listed; the caller must belong to it.
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of projects, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
              example:
                items:
                  - id: prj_7h2k9m4q8w3e6r1t5y0u2i4o6p
                    organization_id: org_2f8s8k4m2c9v0a1b3d5e7f9g1h
                    name: billing-service
                    description: Payments and invoicing
                    version: 3
                    created_at: '2026-10-10T10:00:00Z'
                    updated_at: '2026-10-10T11:30:00Z'
                next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createProject
      summary: Create a project
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
            example:
              organization_id: org_2f8s8k4m2c9v0a1b3d5e7f9g1h
              name: billing-service
              description: Payments and invoicing
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      summary: Get one project
      tags: [projects]
      responses:
        '200':
          description: Project detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateProject
      summary: Update project name, description or settings
      description: |
        Optimistic concurrency: send the `version` you last read. The server
        only applies the change when the stored version still matches, and
        returns 409 with the current version when it does not.
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
            example:
              version: 3
              description: Payments, invoicing and refunds
      responses:
        '200':
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/audit:
    get:
      operationId: listAuditEvents
      summary: List audit events for a project
      description: |
        Append-only activity trail. Requires `project_id`; the caller must be a
        member of the owning organization.
      tags: [audit]
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
          description: Exact action filter, for example `project.created`.
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of audit events, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
              example:
                items:
                  - id: aud_9p0o8i7u6y5t4r3e2w1q
                    organization_id: org_2f8s8k4m2c9v0a1b3d5e7f9g1h
                    project_id: prj_7h2k9m4q8w3e6r1t5y0u2i4o6p
                    actor_id: usr_1a2b3c4d5e6f7g8h9i0j
                    action: project.created
                    entity_type: project
                    entity_id: prj_7h2k9m4q8w3e6r1t5y0u2i4o6p
                    request_id: req_4f2a1b3c5d6e7f8a9b0c
                    payload:
                      name: billing-service
                    sequence: 12
                    created_at: '2026-10-10T10:00:00Z'
                next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/login:
    post:
      operationId: login
      summary: Authenticate with email and password
      description: |
        Returns the authenticated user and sets the session cookie. Repeated
        failures are rate limited per email and per client address; the
        response is identical for unknown email and wrong password so it
        cannot be used to enumerate accounts.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: developer@example.com
              password: correct-horse-battery-staple
      responses:
        '200':
          description: Authentication succeeded.
          headers:
            Set-Cookie:
              description: Opaque session cookie (HttpOnly, SameSite=Strict).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              example:
                user:
                  id: usr_1a2b3c4d5e6f7g8h9i0j
                  email: developer@example.com
                  display_name: Developer
                csrf_token: csrf_9f8e7d6c5b4a
                expires_at: '2026-10-11T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials, unknown account, or rate limited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_credentials
                  message: email or password is incorrect
                  request_id: req_0123456789abcdef
        '429':
          description: Too many failed attempts; retry after the given delay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: rate_limited
                  message: too many failed login attempts; try again later
                  request_id: req_0123456789abcdef

  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      tags: [auth]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Session revoked; the cookie is cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the current session
      description: |
        Issues a new session token and revokes the previous one, so a stolen
        token is only usable until the legitimate client refreshes.
      tags: [auth]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Session rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Current user with roles and permissions
      tags: [auth]
      responses:
        '200':
          description: Authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
              example:
                id: usr_1a2b3c4d5e6f7g8h9i0j
                email: developer@example.com
                display_name: Developer
                organizations:
                  - id: org_2f8s8k4m2c9v0a1b3d5e7f9g1h
                    name: Acme Engineering
                    slug: acme-engineering
                    role: owner
                    permissions: [project.read, project.write, run.execute]
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/members:
    get:
      operationId: listMembers
      summary: List members of an organization
      tags: [members]
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Members with roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
    post:
      operationId: inviteMember
      summary: Invite a member with a role
      description: Requires the member.admin permission. Roles are validated
        server-side; untrusted content can never grant permissions.
      tags: [members]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInvite'
            example:
              organization_id: org_2f8s8k4m2c9v0a1b3d5e7f9g1h
              email: teammate@example.com
              role: maintainer
      responses:
        '201':
          description: Member created or updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/members/{membership_id}:
    parameters:
      - name: membership_id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateMemberRole
      summary: Change a member's role
      description: |
        Requires member.admin. The last owner cannot be demoted or removed,
        and a member cannot escalate their own role.
      tags: [members]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdate'
            example:
              role: reviewer
      responses:
        '200':
          description: Role updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: removeMember
      summary: Remove a member from the organization
      tags: [members]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Member removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/credentials:
    get:
      operationId: listCredentials
      summary: List credential metadata for an organization
      description: |
        Values are never returned. Each item reports kind, label, status, key
        version, fingerprint and verification state.
      tags: [credentials]
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Credential metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
    post:
      operationId: createCredential
      summary: Store an encrypted provider credential
      description: Requires credential.admin. The plaintext value is encrypted
        with envelope AEAD before it touches the database and is never
        returned, logged or exposed to model runs.
      tags: [credentials]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCreate'
            example:
              organization_id: org_2f8s8k4m2c9v0a1b3d5e7f9g1h
              kind: stepfun
              label: production keys
              value: sf-live-xxxxxxxxxxxxxxxx
      responses:
        '201':
          description: Credential stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/credentials/{credential_id}:
    parameters:
      - name: credential_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getCredential
      summary: Credential metadata (never the value)
      tags: [credentials]
      responses:
        '200':
          description: Credential metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: revokeCredential
      summary: Revoke a credential
      description: |
        Revocation destroys the ability to decrypt the stored value; the
        metadata row is retained for audit.
      tags: [credentials]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Credential revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/credentials/{credential_id}/rotate:
    post:
      operationId: rotateCredential
      summary: Replace the credential value and key version
      description: |
        The new value is encrypted; the previous ciphertext is destroyed in the
        same transaction. Unrelated credentials are untouched.
      tags: [credentials]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialRotate'
            example:
              value: sf-live-yyyyyyyyyyyyyyyy
      responses:
        '200':
          description: Credential rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'


  /api/v1/model/provider:
    get:
      operationId: getModelProvider
      summary: Model provider configuration and readiness
      description: |
        Reports the configured provider, model, base URL and whether a live key
        is present. The key itself is never returned.
      tags: [model]
      responses:
        '200':
          description: Provider configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelProviderStatus'
              example:
                configured: true
                provider: stepfun
                model: step-5-preview
                base_url: https://api.stepfun.ai/v1
                reasoning_effort: medium
                key_configured: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /api/v1/model/probe:
    post:
      operationId: probeModelProvider
      summary: Send a minimal completion to the provider
      description: |
        The only endpoint that spends provider budget. Requires
        credential.admin and returns the measured latency and token usage, or a
        mapped provider failure. The prompt is fixed server-side and never
        includes repository content.
      tags: [model]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Provider answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelProbeResult'
              example:
                provider: stepfun
                model: step-5-preview
                latency_ms: 812
                usage:
                  prompt_tokens: 9
                  cached_tokens: 0
                  completion_tokens: 1
                  total_tokens: 10
                finish_reason: stop
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '429':
          description: Provider is rate limiting this workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: provider_rate_limit
                  message: the model provider is rate limiting this workspace
                  request_id: req_0123456789abcdef
        '502':
          description: Provider error or malformed response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: provider_error
                  message: the model provider reported a server error
                  request_id: req_0123456789abcdef
        '503':
          description: No provider key configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: provider_not_configured
                  message: STEPFUN_API_KEY is not configured on this server
                  request_id: req_0123456789abcdef
        '504':
          description: Provider timed out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: provider_timeout
                  message: the model provider timed out
                  request_id: req_0123456789abcdef


  /api/v1/github/installations/connect:
    post:
      operationId: connectInstallation
      summary: Bind a GitHub App installation to the caller's organization
      description: The installation is verified against GitHub before it is stored.
      tags: [github]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallationConnect'
            example:
              installation_id: 12345678
              account_login: acme
      responses:
        '201':
          description: Installation bound.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallationStatus'
              example:
                installation_id: 12345678
                account_login: acme
                repositories: 7
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '502':
          $ref: '#/components/responses/GitHubError'
        '503':
          description: GitHub App is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: github_not_configured
                  message: the GitHub App is not configured on this server
                  request_id: req_0123456789abcdef

  /api/v1/github/repos:
    get:
      operationId: listGitHubRepositories
      summary: List repositories an installation can access
      tags: [github]
      parameters:
        - name: installation_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Accessible repositories.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RepositorySummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          description: Installation is not bound to this organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: not_found
                  message: installation is not connected to this organization
                  request_id: req_0123456789abcdef
        '502':
          $ref: '#/components/responses/GitHubError'
        '503':
          description: GitHub App is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/issues/import:
    post:
      operationId: importIssue
      summary: Import a GitHub issue into a project
      description: |
        Normalizes the issue into a local snapshot with a body hash, labels,
        assignees and comment count. The issue body is untrusted data and is
        never treated as instruction.
      tags: [github]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueImport'
            example:
              project_id: prj_7h2k9m4q8w3e6r1t5y0u2i4o6p
              installation_id: 12345678
              issue_url: https://github.com/acme/billing/issues/12
      responses:
        '201':
          description: Issue imported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/GitHubError'
        '503':
          description: GitHub App is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/issues:
    get:
      operationId: listIssues
      summary: List a project's imported issues
      tags: [github]
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Imported issues, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Issue'
                  next_cursor:
                    type: [string, 'null']
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/webhooks/github:
    post:
      operationId: receiveGitHubWebhook
      summary: GitHub webhook intake
      description: |
        Verifies the HMAC-SHA256 signature, ignores replayed delivery IDs and
        records the delivery. It never starts code execution: runs require a
        separately authorized task start.
      tags: [webhooks]
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema:
            type: string
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Delivery accepted and recorded.
          content:
            application/json:
              schema:
                type: object
                required: [status, delivery_id]
                properties:
                  status:
                    type: string
                    enum: [accepted]
                  delivery_id:
                    type: string
        '200':
          description: Duplicate delivery; already processed.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [duplicate]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Signature verification failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_signature
                  message: webhook signature verification failed
                  request_id: req_0123456789abcdef
        '413':
          description: Payload too large.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Webhook secret is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /api/v1/workspaces:
    post:
      operationId: createWorkspace
      summary: Pin a commit and clone a repository into a workspace
      description: |
        The base commit must be a 40-character SHA. The clone is a detached
        checkout of that commit; the source repository is never modified.
      tags: [workspaces]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreate'
            example:
              project_id: prj_7h2k9m4q8w3e6r1t5y0u2i4o6p
              source_url: https://github.com/acme/billing.git
              base_sha: 9a1aecc0f2b3d4e5f60718293a4b5c6d7e8f9012
      responses:
        '201':
          description: Workspace created at the pinned commit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: Clone failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: clone_failed
                  message: the repository could not be cloned at the pinned commit
                  request_id: req_0123456789abcdef
        '503':
          description: Workspace manager is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/workspaces/{workspace_id}:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: destroyWorkspace
      summary: Remove a workspace and its worktrees
      tags: [workspaces]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Workspace removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/workspaces/{workspace_id}/tree:
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getWorkspaceTree
      summary: List files in a workspace checkout
      tags: [workspaces]
      responses:
        '200':
          description: Workspace file entries.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkspaceFile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'


components:
  schemas:
    LiveStatus:
      type: object
      required: [status, uptime_seconds]
      properties:
        status:
          type: string
          enum: [ok]
        uptime_seconds:
          type: number

    ReadinessReport:
      type: object
      required: [status, checks, generated_at]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        checks:
          type: array
          items:
            $ref: '#/components/schemas/HealthCheck'
        generated_at:
          type: string
          format: date-time

    HealthCheck:
      type: object
      required: [name, status, duration_ms]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [up, down]
        detail:
          type: string
        duration_ms:
          type: integer

    SystemInfo:
      type: object
      required: [name, version, git_commit, environment, go_version, started_at, uptime_seconds]
      properties:
        name:
          type: string
        version:
          type: string
        git_commit:
          type: string
        build_time:
          type: string
        environment:
          type: string
          enum: [development, test, production]
        go_version:
          type: string
        started_at:
          type: string
          format: date-time
        uptime_seconds:
          type: number

    OrganizationRole:
      type: string
      enum: [owner, admin, member, viewer]

    Organization:
      type: object
      required: [id, slug, name, role, created_at, updated_at]
      properties:
        id:
          type: string
          description: Opaque organization identifier.
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,62}[a-z0-9]$'
        name:
          type: string
          minLength: 1
          maxLength: 120
        role:
          $ref: '#/components/schemas/OrganizationRole'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrganizationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        next_cursor:
          type: [string, 'null']

    OrganizationCreate:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,62}[a-z0-9]$'

    Project:
      type: object
      required: [id, organization_id, name, description, version, created_at, updated_at]
      properties:
        id:
          type: string
        organization_id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        version:
          type: integer
          description: Optimistic concurrency version; send it back on PATCH.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        next_cursor:
          type: [string, 'null']

    ProjectCreate:
      type: object
      required: [organization_id, name]
      properties:
        organization_id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000

    ProjectUpdate:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          description: Version the client last read; mismatch returns 409.
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        settings:
          type: object
          additionalProperties: true
          description: Project settings object; unknown keys are rejected.

    ConflictDetail:
      type: object
      required: [code, current_version]
      properties:
        code:
          type: string
          enum: [version_mismatch, duplicate_name]
        current_version:
          type: integer
          description: Present for version_mismatch so clients can reload.
          minimum: 0

    AuditEvent:
      type: object
      required: [id, organization_id, action, entity_type, request_id, sequence, created_at]
      properties:
        id:
          type: string
        organization_id:
          type: string
        project_id:
          type: [string, 'null']
        actor_id:
          type: [string, 'null']
        action:
          type: string
        entity_type:
          type: string
        entity_id:
          type: [string, 'null']
        request_id:
          type: string
        payload:
          type: object
          additionalProperties: true
        sequence:
          type: integer
        created_at:
          type: string
          format: date-time

    AuditEventPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          type: [string, 'null']

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 256
          writeOnly: true

    SessionResponse:
      type: object
      required: [user, csrf_token, expires_at]
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        csrf_token:
          type: string
          description: Value to echo in the X-CSRF-Token header on mutations.
        expires_at:
          type: string
          format: date-time

    UserSummary:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string

    CurrentUser:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          required: [organizations]
          properties:
            organizations:
              type: array
              items:
                $ref: '#/components/schemas/MembershipSummary'

    MembershipSummary:
      type: object
      required: [id, name, slug, role, permissions]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    Role:
      type: string
      enum: [owner, admin, maintainer, reviewer, member, viewer]

    Permission:
      type: string
      enum:
        - project.read
        - project.write
        - run.execute
        - credential.admin
        - member.admin
        - approval.decide
        - merge.execute

    MemberPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        next_cursor:
          type: [string, 'null']

    Member:
      type: object
      required: [id, user_id, email, role, created_at]
      properties:
        id:
          type: string
        user_id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        created_at:
          type: string
          format: date-time

    MemberInvite:
      type: object
      required: [organization_id, email, role]
      properties:
        organization_id:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'

    MemberUpdate:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'

    CredentialKind:
      type: string
      enum: [github_app, stepfun, other]

    CredentialStatus:
      type: string
      enum: [active, rotating, revoked, failed]

    CredentialPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Credential'
        next_cursor:
          type: [string, 'null']

    Credential:
      type: object
      required: [id, organization_id, kind, label, status, key_version, fingerprint, created_at]
      properties:
        id:
          type: string
        organization_id:
          type: string
        kind:
          $ref: '#/components/schemas/CredentialKind'
        label:
          type: string
        status:
          $ref: '#/components/schemas/CredentialStatus'
        key_version:
          type: integer
          description: Envelope key version used to encrypt the value.
        fingerprint:
          type: string
          description: Non-reversible fingerprint used for idempotent upserts.
        last_verified_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time

    CredentialCreate:
      type: object
      required: [organization_id, kind, label, value]
      properties:
        organization_id:
          type: string
        kind:
          $ref: '#/components/schemas/CredentialKind'
        label:
          type: string
          minLength: 1
          maxLength: 120
        value:
          type: string
          minLength: 8
          maxLength: 4096
          writeOnly: true

    CredentialRotate:
      type: object
      required: [value]
      properties:
        value:
          type: string
          minLength: 8
          maxLength: 4096
          writeOnly: true

    ModelProviderStatus:
      type: object
      required: [configured, provider, model, base_url, reasoning_effort, key_configured]
      properties:
        configured:
          type: boolean
          description: Whether a live provider client is wired.
        provider:
          type: string
        model:
          type: string
        base_url:
          type: string
        reasoning_effort:
          type: string
          enum: [low, medium, high]
        key_configured:
          type: boolean
          description: Whether a provider key is present. The key is never returned.

    ModelProbeResult:
      type: object
      required: [provider, model, latency_ms, usage]
      properties:
        provider:
          type: string
        model:
          type: string
        latency_ms:
          type: integer
        usage:
          type: object
          required: [prompt_tokens, completion_tokens, total_tokens]
          properties:
            prompt_tokens:
              type: integer
            cached_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer
        finish_reason:
          type: string

    InstallationConnect:
      type: object
      required: [installation_id]
      properties:
        installation_id:
          type: integer
          minimum: 1
        account_login:
          type: string
          maxLength: 120

    InstallationStatus:
      type: object
      required: [installation_id, account_login, repositories]
      properties:
        installation_id:
          type: integer
        account_login:
          type: string
        repositories:
          type: integer

    RepositorySummary:
      type: object
      required: [id, full_name, default_branch, private, archived]
      properties:
        id:
          type: integer
        full_name:
          type: string
        name:
          type: string
        default_branch:
          type: string
        private:
          type: boolean
        archived:
          type: boolean
        html_url:
          type: string

    IssueImport:
      type: object
      required: [project_id, installation_id, issue_url]
      properties:
        project_id:
          type: string
        installation_id:
          type: integer
          minimum: 1
        issue_url:
          type: string
          description: Full GitHub issue URL.

    Issue:
      type: object
      required: [id, project_id, number, title, body, state, comments_count, body_hash, created_at, updated_at]
      properties:
        id:
          type: string
        project_id:
          type: string
        number:
          type: integer
        title:
          type: string
        body:
          type: string
          description: Untrusted issue text; never treated as instruction.
        state:
          type: string
          enum: [open, closed]
        labels:
          type: array
          items:
            type: string
        assignees:
          type: array
          items:
            type: string
        comments_count:
          type: integer
        body_hash:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WorkspaceCreate:
      type: object
      required: [project_id, source_url, base_sha]
      properties:
        project_id:
          type: string
        source_url:
          type: string
          description: Repository URL the workspace clones from.
        base_sha:
          type: string
          pattern: '^[0-9a-f]{40}$'

    Workspace:
      type: object
      required: [id, base_sha, source_url, default_ref, created_at]
      properties:
        id:
          type: string
        base_sha:
          type: string
          pattern: '^[0-9a-f]{40}$'
        source_url:
          type: string
        default_ref:
          type: string
        created_at:
          type: string
          format: date-time

    WorkspaceFile:
      type: object
      required: [path, is_dir, size]
      properties:
        path:
          type: string
        is_dir:
          type: boolean
        size:
          type: integer

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true

  responses:
    GitHubError:
      description: GitHub refused or failed the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: github_permission_denied
              message: GitHub denied access with this installation
              request_id: req_0123456789abcdef
    BadRequest:
      description: Client-correctable request error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: validation_failed
              message: name is required
              request_id: req_0123456789abcdef
    Unauthorized:
      description: No authenticated subject.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthenticated
              message: authentication is required
              request_id: req_0123456789abcdef
    PermissionDenied:
      description: Subject lacks the required role for this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: permission_denied
              message: you do not have access to this organization
              request_id: req_0123456789abcdef
    NotFound:
      description: Resource does not exist (or is not visible to this subject).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: resource not found
              request_id: req_0123456789abcdef
    Conflict:
      description: Optimistic concurrency or uniqueness conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: version_mismatch
              message: project was modified by someone else
              request_id: req_0123456789abcdef
              details:
                current_version: 4
    InternalError:
      description: Unexpected server failure. The body never contains internal detail.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: internal_error
              message: internal server error
              request_id: req_0123456789abcdef

  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Correlation ID; echoed on the response and in server logs.
      schema:
        type: string
        maxLength: 128
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF token returned by login or refresh; required for
        cookie-authenticated mutations.
      schema:
        type: string
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required for create/update operations. Repeating a request with the
        same key returns the original result instead of duplicating effects.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor from a previous `next_cursor`.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Page size (1-100, default 20).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Query:
      name: q
      in: query
      required: false
      description: Case-insensitive name filter.
      schema:
        type: string
        maxLength: 120
