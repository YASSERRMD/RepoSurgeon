  /api/v1/runs:
    post:
      operationId: createRun
      summary: Create a durable run and enqueue its task
      description: |
        Creates the run in the `queued` state and enqueues exactly one task.
        A repeated request with the same Idempotency-Key returns the original
        run instead of creating a second one.
      tags: [runs]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCreate'
            example:
              project_id: prj_7h2k9m4q8w3e6r1t5y0u2i4o6p
              issue_id: iss_9p0o8i7u6y5t4r3e2w1q
              base_sha: 9a1aecc0f2b3d4e5f60718293a4b5c6d7e8f9012
              model:
                provider: stepfun
                id: step-5-preview
                reasoning_effort: high
              limits:
                max_steps: 60
                max_duration_seconds: 3600
                max_usd: 10.0
              policy:
                external_pr_allowed: true
                merge_requires_approval: true
      responses:
        '201':
          description: Run created and task enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      operationId: listRuns
      summary: List a project's runs
      tags: [runs]
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Runs, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Run'
                  next_cursor:
                    type: [string, 'null']
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

