            application/json:
              schema:
                type: object
                required: [workspace_id, query, items]
                properties:
                  workspace_id:
                    type: string
                  query:
                    type: string
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchHit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
