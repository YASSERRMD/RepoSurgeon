  /api/v1/runs/{run_id}/context/refresh:
    parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: refreshRunContext
      summary: Rebuild the context for a run
      description: |
        Re-indexes the workspace, builds context within the requested token
        budget and records the manifest with provenance. The budget defaults
        to 32768 tokens; the full model window is never the default.
      tags: [context]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextRefresh'
            example:
              workspace_id: wsp_1a2b3c4d5e6f7g8h9i0j
              query: pagination off by one in list handler
              token_budget: 32768
              expand: true
      responses:
        '201':
          description: Manifest built and recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextManifest'
