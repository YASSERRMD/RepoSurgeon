  /api/v1/runs/{run_id}/plan:
    parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: savePlan
      summary: Submit a typed plan for a run
      description: |
        The plan is validated and verified against the repository index before
        it is stored. Plans citing files that do not exist are rejected with
        422. High-risk and security plans are stored as `awaiting_approval`.
      tags: [plans]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanSubmission'
            example:
              base_sha: 9a1aecc0f2b3d4e5f60718293a4b5c6d7e8f9012
              context_sha256: 4f2a1b3c5d6e7f8a9b0c
              plan:
                kind: bug
                risk: high
                summary: Fix the pagination off-by-one in the list handler
                base_sha: 9a1aecc0f2b3d4e5f60718293a4b5c6d7e8f9012
                hypotheses:
                  - statement: The limit is incremented before the offset
                    evidence: ["internal/api/list.go:120"]
                nodes:
                  - key: investigate
                    title: Confirm the off-by-one
                    kind: investigate
                    evidence: ["internal/api/list.go:120"]
                  - key: fix
                    title: Bound the limit before offset
                    kind: edit
                    path: internal/api/list.go
                    prerequisites: [investigate]
                    evidence: ["internal/api/list.go:120"]
                  - key: test
                    title: Add a regression test
                    kind: test
                    prerequisites: [fix]
                acceptance:
                  - key: ac1
                    description: A page of 10 never returns 11 rows
                    verification: go test ./internal/api/...
                out_of_scope: [UI pagination controls]
                assumptions: [The store returns rows in insertion order]
      responses:
        '201':
          description: Plan stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Verification failed; referenced files are missing or the plan is not actionable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: plan_verification_failed
                  message: plan references "ghost.go" which is not in the indexed workspace
                  request_id: req_0123456789abcdef
    get:
      operationId: getPlan
      summary: Get the latest plan revision for a run
      tags: [plans]
      responses:
        '200':
          description: Latest plan revision with findings and approvals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          description: No plan exists for this run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/runs/{run_id}/plan/approve:
    parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: decidePlan
      summary: Approve or reject a plan revision
      description: |
        Requires approval.decide. A revision can only be decided once; a new
        revision supersedes the previous one and invalidates its approvals.
      tags: [plans]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanDecision'
            example:
              revision: 1
              decision: approve
              reason: verified the diff and test evidence locally
      responses:
        '200':
          description: Decision recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          description: Revision mismatch or already decided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: plan_conflict
                  message: plan revision already decided
                  request_id: req_0123456789abcdef


components:
  schemas:
