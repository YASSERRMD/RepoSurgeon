  /api/v1/runs/{run_id}/recover:
    parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: recoverRun
      summary: Plan the next bounded repair attempt
      description: |
        Records one bounded retry for the run. A proven loop (the same diff
        applied again, the same failure signature recurring, or attempts with
        no measurable change to the failing-test set) stops the run as blocked
        and the evidence is returned instead of spending another attempt.
      tags: [recovery]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoverRequest'
            example:
              workspace_id: wsp_1a2b3c4d5e6f7g8h9i0j
              class: test_failure
              reason: Repair the red suite from the last diagnostic
      responses:
        '201':
          description: The next attempt is planned and journalled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoverResponse'
        '400':
          description: Unknown failure class.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The run is blocked because a repair loop is proven.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: recovery_loop_detected
                  message: "diff diff_a1b2c3d4e5f6 was already applied; applying it again on attempt 2 would repeat the same change"
                  request_id: req_0123456789abcdef
                  details:
                    loop:
                      kind: identical_patch
                      attempts: 2
                      fingerprint: diff_a1b2c3d4e5f6
                      evidence: diff diff_a1b2c3d4e5f6 was already applied
                    attempt: 2
                    fingerprint: diff_a1b2c3d4e5f6
        '429':
          description: The bounded retry budget for the class is spent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Recovery service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/runs/{run_id}/recovery:
    parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getRecovery
      summary: Read the recovery timeline, budgets and checkpoints of a run
      tags: [recovery]
      responses:
        '200':
          description: Recovery state of the run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Recovery service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/runs/{run_id}/rollback:
    parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: rollbackRun
      summary: Restore the workspace to a known-good checkpoint
      description: |
        Rewrites the workspace to the snapshot state and verifies the result.
        The effect_id makes the restore idempotent: a replay of the same
        effect_id returns the recorded outcome without writing the workspace a
        second time.
      tags: [recovery]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackRequest'
            example:
              effect_id: effect_rollback_1
              reason: Suite deteriorated after the second patch
      responses:
        '200':
          description: The workspace was restored (or the restore replayed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollbackResponse'
        '400':
          description: effect_id is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No checkpoint is available for this run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The workspace could not be resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/runs/{run_id}/pr:
    parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: openPullRequest
      summary: Compose the branch and open one pull request
      description: |
        Runs the push gate first: every required check must have run green, the
        secret scan must be clean, every changed path must be allowlisted and
        the pinned base must not have moved unless the change was rebased and
        retested. A refusal answers 400 with every rule that blocked the push.
        The effect_id makes the create exactly-once: a replayed request answers
        with the recorded pull request instead of opening a second one.
      tags: [pull_requests]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenPullRequestRequest'
            example:
              workspace_id: wsp_1a2b3c4d5e6f7g8h9i0j
              effect_id: effect_open_1
              head: agent/run-pr
              base: main
              title: "m13: bound the pagination limit"
              issue_number: 42
              repo_owner: acme
              repo_name: app
              summary: Bound the limit before the offset.
              risks: [The runner is not exercised in CI.]
              secret_scan_clean: true
              pinned_sha: 9a1aecc0f2b3d4e5f60718293a4b5c6d7e8f9012
              base_sha: 9a1aecc0f2b3d4e5f60718293a4b5c6d7e8f9012
              files: [internal/api/list.go]
              checks:
                - profile: go.test
                  verdict: green
                  ran: true
                - profile: go.build
                  verdict: green
                  ran: true
              commits:
                - message: "m13: bound the limit"
                  paths: [internal/api/list.go]
      responses:
        '201':
          description: The pull request was opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequestView'
        '200':
          description: A pull request already exists for this effect id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequestView'
        '400':
          description: The push gate refused the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: pr_push_refused
                  message: "required check go.build did not run"
                  request_id: req_0123456789abcdef
                  details:
                    stage: push
                    reasons: [required check go.build did not run]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: The pull request service is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: getPullRequest
      summary: Read the tracked pull request of a run
      description: Returns the recorded pull request refreshed from GitHub, including its real check runs and reviews.
      tags: [pull_requests]
      responses:
        '200':
          description: The tracked pull request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequestView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: The pull request service is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/runs/{run_id}/merge:
    parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: mergePullRequest
      summary: Merge the pull request under an explicit human authorization
      description: |
        The gate is evaluated against real GitHub state immediately before the
        merge: required checks must have concluded success, the required
        approvals must be recorded and a permitted human must authorize it. A
        model identity, a bot identity and an empty authorization are refused.
      tags: [pull_requests]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergePullRequestBody'
            example:
              authorized_by: maintainer@example.test
              method: merge
      responses:
        '200':
          description: The pull request was merged, or the merge was already recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeResult'
        '400':
          description: The authorization is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The merge gate refused the merge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: pr_merge_refused
                  message: "required GitHub check verify concluded failed"
                  request_id: req_0123456789abcdef
                  details:
                    stage: merge
                    reasons: [required GitHub check verify concluded failed]

  /api/v1/runs/{run_id}/abandon:
    parameters:
      - name: run_id
