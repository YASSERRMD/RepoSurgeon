          type: string
        size_bytes:
          type: integer
        line_count:
          type: integer
        sha256:
          type: string
        indexed_at:
          type: string
          format: date-time

    ContextRefresh:
      type: object
      required: [workspace_id, query]
      properties:
        workspace_id:
          type: string
        query:
          type: string
          description: Search terms used to retrieve context.
        token_budget:
          type: integer
          enum: [32768, 131072, 262144]
        expand:
          type: boolean
          description: Expand the manifest with additional retrieval after the first pass.

    ContextManifest:
      type: object
      required: [id, workspace_id, query, strategy, token_budget, token_estimate, truncated, items, created_at]
      properties:
        id:
          type: string
        run_id:
          type: string
        workspace_id:
          type: string
        query:
          type: string
        strategy:
          type: string
          enum: [search, symbol, issue_files, expansion]
        token_budget:
          type: integer
        token_estimate:
          type: integer
        truncated:
          type: boolean
        omitted_paths:
          type: array
          items:
            type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContextItem'
        untrusted_notes:
          type: array
          items:
            type: string
          description: Notices stating that repository content is untrusted data.
        created_at:
          type: string
          format: date-time

    ContextItem:
      type: object
      required: [path, line_start, line_end, content, reason, token_estimate, sha256]
      properties:
        path:
          type: string
        line_start:
          type: integer
        line_end:
          type: integer
        content:
          type: string
        reason:
          type: string
          description: Why this range was retrieved.
        token_estimate:
          type: integer
        sha256:
          type: string

    PlanSubmission:
      type: object
      required: [base_sha, plan]
      properties:
        base_sha:
          type: string
          pattern: '^[0-9a-f]{40}$'
        context_sha256:
          type: string
        plan:
          $ref: '#/components/schemas/Plan'

    Plan:
      type: object
      required: [kind, risk, summary, base_sha, nodes, acceptance, hypotheses]
      properties:
        kind:
          type: string
          enum: [bug, feature, refactor, security]
        risk:
          type: string
          enum: [low, medium, high]
        summary:
          type: string
          minLength: 1
        base_sha:
          type: string
          pattern: '^[0-9a-f]{40}$'
        hypotheses:
          type: array
          minItems: 0
          items:
            type: object
            required: [statement, evidence]
            properties:
              statement:
                type: string
              evidence:
                type: array
                minItems: 1
                items:
                  type: string
        nodes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PlanNode'
        acceptance:
          type: array
          items:
            $ref: '#/components/schemas/AcceptanceCriterion'
        out_of_scope:
          type: array
          items:
            type: string
        assumptions:
          type: array
          items:
            type: string

    PlanNode:
      type: object
      required: [key, title, kind]
      properties:
        key:
          type: string
        title:
          type: string
        kind:
          type: string
          enum: [investigate, edit, test, verify, review]
        path:
          type: string
          description: Repository-relative path; required for edit nodes.
        line_hint:
          type: integer
        prerequisites:
          type: array
          items:
            type: string
        evidence:
          type: array
          items:
            type: string

    AcceptanceCriterion:
      type: object
      required: [key, description]
      properties:
        key:
          type: string
        description:
          type: string
        verification:
          type: string
          description: Command or check that proves the criterion.

    PlanView:
      type: object
      required: [id, run_id, revision, kind, risk, summary, status, nodes, acceptance, findings, created_at]
      properties:
        id:
          type: string
        run_id:
          type: string
        revision:
          type: integer
        kind:
          type: string
        risk:
          type: string
        summary:
          type: string
        status:
          type: string
          enum: [draft, awaiting_approval, approved, rejected, superseded]
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/PlanNode'
        acceptance:
          type: array
          items:
            $ref: '#/components/schemas/AcceptanceCriterion'
        findings:
          type: array
          items:
            type: object
            required: [severity, code, message]
            properties:
              severity:
                type: string
                enum: [error, warning]
              code:
                type: string
              message:
                type: string
        approvals:
          type: array
          items:
            type: object
            required: [revision, actor_id, decision, created_at]
            properties:
              revision:
                type: integer
              actor_id:
                type: string
              decision:
                type: string
                enum: [approved, rejected]
              reason:
                type: string
              created_at:
                type: string
        created_at:
          type: string

    PlanDecision:
      type: object
      required: [revision, decision]
      properties:
        revision:
          type: integer
          minimum: 1
        decision:
          type: string
          enum: [approve, reject]
        reason:
          type: string
          maxLength: 2000

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true

  responses:
    GitHubError:
      description: GitHub refused or failed the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: github_permission_denied
              message: GitHub denied access with this installation
              request_id: req_0123456789abcdef
    BadRequest:
      description: Client-correctable request error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: validation_failed
              message: name is required
              request_id: req_0123456789abcdef
    Unauthorized:
      description: No authenticated subject.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthenticated
              message: authentication is required
              request_id: req_0123456789abcdef
    PermissionDenied:
      description: Subject lacks the required role for this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: permission_denied
              message: you do not have access to this organization
              request_id: req_0123456789abcdef
    NotFound:
      description: Resource does not exist (or is not visible to this subject).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: resource not found
              request_id: req_0123456789abcdef
    Conflict:
      description: Optimistic concurrency or uniqueness conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: version_mismatch
              message: project was modified by someone else
              request_id: req_0123456789abcdef
              details:
                current_version: 4
    InternalError:
      description: Unexpected server failure. The body never contains internal detail.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: internal_error
              message: internal server error
              request_id: req_0123456789abcdef

  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Correlation ID; echoed on the response and in server logs.
      schema:
        type: string
        maxLength: 128
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF token returned by login or refresh; required for
        cookie-authenticated mutations.
      schema:
        type: string
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required for create/update operations. Repeating a request with the
        same key returns the original result instead of duplicating effects.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor from a previous `next_cursor`.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Page size (1-100, default 20).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Query:
      name: q
      in: query
      required: false
      description: Case-insensitive name filter.
      schema:
        type: string
        maxLength: 120
