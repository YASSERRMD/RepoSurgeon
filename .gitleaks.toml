title = "RepoSurgeon gitleaks configuration"

# Extend the default rule set; this file only narrows one known false-positive
# source: the redaction unit tests contain deliberately fake credential
# strings (for example "token: abc123") that must be scanned by our own
# redaction logic, not flagged as leaked secrets. The allowlist is scoped to
# exactly that file.
[extend]
useDefault = true

[allowlist]
description = "Deliberately fake credential fixtures in redaction unit tests"
paths = [
    '''internal/redact/redact_test\.go$''',
]
