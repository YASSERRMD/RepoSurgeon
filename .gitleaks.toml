title = "RepoSurgeon gitleaks configuration"

# Extend the default rule set; this file only narrows one known
# false-positive source that contains deliberately non-secret credential
# material.
[extend]
useDefault = true

[[allowlists]]
description = "Deliberately fake credential fixtures in redaction unit tests"
paths = [
    '''internal/redact/redact_test\.go$''',
]
