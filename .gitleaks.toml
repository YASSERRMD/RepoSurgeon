title = "RepoSurgeon gitleaks configuration"

# Extend the default rule set; this file narrows two known false positives
# that contain deliberately non-secret credential material.
[extend]
useDefault = true

[[allowlists]]
description = "Deliberately fake credential fixtures in redaction unit tests"
paths = [
    '''internal/redact/redact_test\.go$''',
]

[[allowlists]]
description = "CI credential key handling in the compose smoke workflow; values are generated at run time with openssl and never stored in the repository"
paths = [
    '''\.github/workflows/compose-smoke\.yml$''',
]
