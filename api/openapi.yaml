  /api/v1/webhooks/github:
    post:
      operationId: receiveGitHubWebhook
      summary: GitHub webhook intake
      description: |
        Verifies the HMAC-SHA256 signature, ignores replayed delivery IDs and
        records the delivery. It never starts code execution: runs require a
        separately authorized task start.
      tags: [webhooks]
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema:
            type: string
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Delivery accepted and recorded.
          content:
            application/json:
              schema:
                type: object
                required: [status, delivery_id]
                properties:
                  status:
                    type: string
                    enum: [accepted]
                  delivery_id:
                    type: string
        '200':
          description: Duplicate delivery; already processed.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [duplicate]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Signature verification failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_signature
                  message: webhook signature verification failed
                  request_id: req_0123456789abcdef
        '413':
          description: Payload too large.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Webhook secret is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /api/v1/workspaces:
    post:
      operationId: createWorkspace
      summary: Pin a commit and clone a repository into a workspace
      description: |
        The base commit must be a 40-character SHA. The clone is a detached
        checkout of that commit; the source repository is never modified.
      tags: [workspaces]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreate'
            example:
              project_id: prj_7h2k9m4q8w3e6r1t5y0u2i4o6p
              source_url: https://github.com/acme/billing.git
              base_sha: 9a1aecc0f2b3d4e5f60718293a4b5c6d7e8f9012
      responses:
        '201':
          description: Workspace created at the pinned commit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: Clone failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: clone_failed
                  message: the repository could not be cloned at the pinned commit
                  request_id: req_0123456789abcdef
        '503':
          description: Workspace manager is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

