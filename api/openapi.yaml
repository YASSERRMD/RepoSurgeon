          application/json:
            schema:
              $ref: '#/components/schemas/ContextRefresh'
            example:
              workspace_id: wsp_1a2b3c4d5e6f7g8h9i0j
              query: pagination off by one in list handler
              token_budget: 32768
              expand: true
      responses:
        '201':
          description: Manifest built and recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextManifest'
