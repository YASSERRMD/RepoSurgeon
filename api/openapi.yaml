          type: string
        status:
          type: string
          enum: [up, down]
        detail:
          type: string
        duration_ms:
          type: integer

    SystemInfo:
      type: object
      required: [name, version, git_commit, environment, go_version, started_at, uptime_seconds]
      properties:
        name:
          type: string
        version:
          type: string
        git_commit:
          type: string
        build_time:
          type: string
        environment:
          type: string
          enum: [development, test, production]
        go_version:
          type: string
        started_at:
          type: string
          format: date-time
        uptime_seconds:
          type: number

    OrganizationRole:
      type: string
      enum: [owner, admin, member, viewer]

    Organization:
      type: object
      required: [id, slug, name, role, created_at, updated_at]
      properties:
        id:
          type: string
          description: Opaque organization identifier.
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,62}[a-z0-9]$'
        name:
          type: string
          minLength: 1
          maxLength: 120
        role:
          $ref: '#/components/schemas/OrganizationRole'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrganizationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        next_cursor:
          type: [string, 'null']

    OrganizationCreate:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,62}[a-z0-9]$'

    Project:
      type: object
      required: [id, organization_id, name, description, version, created_at, updated_at]
      properties:
        id:
          type: string
        organization_id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        version:
          type: integer
          description: Optimistic concurrency version; send it back on PATCH.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        next_cursor:
          type: [string, 'null']

    ProjectCreate:
      type: object
      required: [organization_id, name]
      properties:
        organization_id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000

    ProjectUpdate:
      type: object
      required: [version]
