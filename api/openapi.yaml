        '200':
          description: The stored settings, or the empty document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: The console service is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: savePreferences
      summary: Store the view settings of the caller
      description: The settings document is persisted so a reload restores the layout, filters and table density the operator chose.
      tags: [console]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesSaveRequest'
            example:
              view:
                table_density: comfortable
                active_section: runs
                filters:
                  state: blocked
      responses:
        '200':
          description: The stored settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesView'
        '400':
          description: The document is malformed or too large.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: The console service is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


components:
  schemas:
    LiveStatus:
      type: object
      required: [status, uptime_seconds]
      properties:
        status:
          type: string
          enum: [ok]
        uptime_seconds:
          type: number

    ReadinessReport:
      type: object
      required: [status, checks, generated_at]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        checks:
          type: array
          items:
            $ref: '#/components/schemas/HealthCheck'
        generated_at:
          type: string
          format: date-time

    HealthCheck:
      type: object
      required: [name, status, duration_ms]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [up, down]
        detail:
          type: string
        duration_ms:
          type: integer

    SystemInfo:
      type: object
      required: [name, version, git_commit, environment, go_version, started_at, uptime_seconds]
      properties:
        name:
          type: string
        version:
          type: string
        git_commit:
          type: string
        build_time:
          type: string
        environment:
          type: string
          enum: [development, test, production]
        go_version:
          type: string
        started_at:
          type: string
          format: date-time
        uptime_seconds:
          type: number

    OrganizationRole:
      type: string
      enum: [owner, admin, member, viewer]

    Organization:
      type: object
      required: [id, slug, name, role, created_at, updated_at]
      properties:
        id:
          type: string
          description: Opaque organization identifier.
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,62}[a-z0-9]$'
        name:
          type: string
          minLength: 1
          maxLength: 120
        role:
          $ref: '#/components/schemas/OrganizationRole'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrganizationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        next_cursor:
          type: [string, 'null']

    OrganizationCreate:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,62}[a-z0-9]$'

    Project:
      type: object
      required: [id, organization_id, name, description, version, created_at, updated_at]
      properties:
        id:
          type: string
        organization_id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        version:
          type: integer
          description: Optimistic concurrency version; send it back on PATCH.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        next_cursor:
          type: [string, 'null']

    ProjectCreate:
      type: object
      required: [organization_id, name]
      properties:
        organization_id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000

    ProjectUpdate:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          description: Version the client last read; mismatch returns 409.
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        settings:
          type: object
          additionalProperties: true
          description: Project settings object; unknown keys are rejected.

    ConflictDetail:
      type: object
      required: [code, current_version]
      properties:
        code:
          type: string
          enum: [version_mismatch, duplicate_name]
        current_version:
          type: integer
          description: Present for version_mismatch so clients can reload.
          minimum: 0

    AuditEvent:
      type: object
      required: [id, organization_id, action, entity_type, request_id, sequence, created_at]
      properties:
        id:
          type: string
        organization_id:
          type: string
        project_id:
          type: [string, 'null']
        actor_id:
          type: [string, 'null']
        action:
          type: string
        entity_type:
          type: string
        entity_id:
          type: [string, 'null']
        request_id:
          type: string
        payload:
          type: object
          additionalProperties: true
        sequence:
          type: integer
        created_at:
          type: string
          format: date-time

    AuditEventPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          type: [string, 'null']

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 256
          writeOnly: true

    SessionResponse:
      type: object
      required: [user, csrf_token, expires_at]
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        csrf_token:
          type: string
          description: Value to echo in the X-CSRF-Token header on mutations.
        expires_at:
          type: string
          format: date-time

    UserSummary:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string

    CurrentUser:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          required: [organizations]
          properties:
            organizations:
              type: array
              items:
                $ref: '#/components/schemas/MembershipSummary'

    MembershipSummary:
      type: object
      required: [id, name, slug, role, permissions]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    Role:
      type: string
      enum: [owner, admin, maintainer, reviewer, member, viewer]

    Permission:
      type: string
      enum:
        - project.read
        - project.write
        - run.execute
        - credential.admin
        - member.admin
        - approval.decide
        - merge.execute

    MemberPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        next_cursor:
          type: [string, 'null']

    Member:
      type: object
      required: [id, user_id, email, role, created_at]
      properties:
        id:
          type: string
        user_id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        created_at:
          type: string
          format: date-time

    MemberInvite:
      type: object
      required: [organization_id, email, role]
      properties:
        organization_id:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'

    MemberUpdate:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'

    CredentialKind:
      type: string
      enum: [github_app, stepfun, other]

    CredentialStatus:
      type: string
      enum: [active, rotating, revoked, failed]

    CredentialPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Credential'
        next_cursor:
          type: [string, 'null']

    Credential:
      type: object
      required: [id, organization_id, kind, label, status, key_version, fingerprint, created_at]
      properties:
        id:
          type: string
        organization_id:
          type: string
        kind:
          $ref: '#/components/schemas/CredentialKind'
        label:
          type: string
        status:
          $ref: '#/components/schemas/CredentialStatus'
        key_version:
          type: integer
          description: Envelope key version used to encrypt the value.
        fingerprint:
          type: string
          description: Non-reversible fingerprint used for idempotent upserts.
        last_verified_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time

    CredentialCreate:
      type: object
      required: [organization_id, kind, label, value]
      properties:
        organization_id:
          type: string
        kind:
          $ref: '#/components/schemas/CredentialKind'
        label:
          type: string
          minLength: 1
          maxLength: 120
        value:
          type: string
          minLength: 8
          maxLength: 4096
          writeOnly: true

    CredentialRotate:
      type: object
      required: [value]
      properties:
        value:
          type: string
          minLength: 8
          maxLength: 4096
          writeOnly: true

    ModelProviderStatus:
      type: object
      required: [configured, provider, model, base_url, reasoning_effort, key_configured]
      properties:
        configured:
          type: boolean
          description: Whether a live provider client is wired.
        provider:
          type: string
        model:
          type: string
        base_url:
          type: string
        reasoning_effort:
          type: string
          enum: [low, medium, high]
        key_configured:
          type: boolean
          description: Whether a provider key is present. The key is never returned.

    ModelProbeResult:
      type: object
      required: [provider, model, latency_ms, usage]
      properties:
        provider:
          type: string
        model:
          type: string
        latency_ms:
          type: integer
        usage:
          type: object
          required: [prompt_tokens, completion_tokens, total_tokens]
          properties:
            prompt_tokens:
              type: integer
            cached_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer
        finish_reason:
          type: string

    InstallationConnect:
      type: object
      required: [installation_id]
      properties:
        installation_id:
          type: integer
          minimum: 1
        account_login:
          type: string
          maxLength: 120

    InstallationStatus:
      type: object
      required: [installation_id, account_login, repositories]
      properties:
        installation_id:
          type: integer
        account_login:
          type: string
        repositories:
          type: integer

    RepositorySummary:
      type: object
      required: [id, full_name, default_branch, private, archived]
      properties:
        id:
          type: integer
        full_name:
          type: string
        name:
          type: string
        default_branch:
          type: string
        private:
          type: boolean
        archived:
          type: boolean
        html_url:
          type: string

    IssueImport:
      type: object
      required: [project_id, installation_id, issue_url]
      properties:
        project_id:
          type: string
        installation_id:
          type: integer
          minimum: 1
        issue_url:
          type: string
          description: Full GitHub issue URL.

    Issue:
      type: object
      required: [id, project_id, number, title, body, state, comments_count, body_hash, created_at, updated_at]
      properties:
        id:
          type: string
        project_id:
          type: string
        number:
          type: integer
        title:
          type: string
        body:
          type: string
          description: Untrusted issue text; never treated as instruction.
        state:
          type: string
          enum: [open, closed]
        labels:
          type: array
          items:
            type: string
        assignees:
          type: array
          items:
            type: string
        comments_count:
          type: integer
        body_hash:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WorkspaceCreate:
      type: object
      required: [project_id, source_url, base_sha]
      properties:
        project_id:
          type: string
        source_url:
          type: string
          description: Repository URL the workspace clones from.
        base_sha:
          type: string
          pattern: '^[0-9a-f]{40}$'

    Workspace:
      type: object
      required: [id, base_sha, source_url, default_ref, created_at]
      properties:
        id:
          type: string
        base_sha:
          type: string
          pattern: '^[0-9a-f]{40}$'
        source_url:
          type: string
        default_ref:
          type: string
        created_at:
          type: string
          format: date-time

    WorkspaceFile:
      type: object
      required: [path, is_dir, size]
      properties:
        path:
          type: string
        is_dir:
          type: boolean
        size:
          type: integer

    RunCreate:
      type: object
      required: [project_id]
      properties:
        project_id:
          type: string
        issue_id:
          type: string
        base_sha:
          type: string
          pattern: '^[0-9a-f]{40}$'
        model:
          type: object
          properties:
            provider:
              type: string
            id:
              type: string
            reasoning_effort:
              type: string
              enum: [low, medium, high]
        limits:
          type: object
          properties:
            max_steps:
              type: integer
            max_duration_seconds:
              type: integer
            max_usd:
              type: number
        policy:
          type: object
          properties:
            external_pr_allowed:
              type: boolean
            merge_requires_approval:
              type: boolean

    RunState:
      type: string
      description: Every state the durable run state machine can record.
      enum: [queued, intaking, analyzing, planning, awaiting_approval, editing, testing, reviewing, pr_ready, pr_open, completed, failed, canceled, blocked]

    Run:
      type: object
      required: [id, organization_id, project_id, state, attempt, created_at, updated_at]
      properties:
        id:
          type: string
        organization_id:
          type: string
        project_id:
          type: string
        issue_id:
          type: string
        state:
          type: string
          enum: [queued, intaking, analyzing, planning, awaiting_approval, editing, testing, reviewing, pr_ready, pr_open, completed, failed, canceled, blocked]
        base_sha:
          type: string
        attempt:
          type: integer
        model_config:
          type: object
          additionalProperties: true
        limits:
          type: object
          additionalProperties: true
        policy:
          type: object
          additionalProperties: true
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: [string, 'null']
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time

    RunStateChange:
      type: object
      required: [id, to_state, actor_type, created_at]
      properties:
        id:
          type: string
        from_state:
          type: string
        to_state:
          type: string
        reason:
          type: string
        actor_type:
          type: string
          enum: [system, user, worker, model]
        created_at:
          type: string
          format: date-time

    ToolDescriptor:
      type: object
      required: [name, description, risk, permission, approval, sandboxed, permitted]
      properties:
        name:
          type: string
        description:
          type: string
        risk:
          type: string
          enum: [read_only, workspace_write, sandboxed_exec, external_side_effect]
        permission:
          type: string
        approval:
          type: boolean
          description: Whether a human decision is always required.
        sandboxed:
          type: boolean
          description: Whether the tool runs inside the isolated runner.
        permitted:
          type: boolean
          description: Whether the caller's role permits the tool.

    Approval:
      type: object
      required: [id, organization_id, action, reason, state, requested_by, created_at, updated_at]
      properties:
        id:
          type: string
        organization_id:
          type: string
        project_id:
          type: string
        run_id:
          type: string
        action:
          type: string
        reason:
          type: string
        state:
          type: string
          enum: [pending, approved, rejected, expired]
        requested_by:
          type: string
        decided_by:
          type: string
        decision_reason:
          type: string
        expires_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ApprovalCreate:
      type: object
      required: [action]
      properties:
        run_id:
          type: string
        action:
          type: string
          description: Registered tool name.
        reason:
          type: string
          maxLength: 2000

    ApprovalDecision:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        reason:
          type: string
          maxLength: 2000

    SearchHit:
      type: object
      required: [path, line, line_end, preview, match]
      properties:
        path:
          type: string
        line:
          type: integer
        line_end:
          type: integer
        preview:
          type: string
        match:
          type: string

    SymbolHit:
      type: object
      required: [path, name, kind, line, signature, exported]
      properties:
        path:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [func, type, const, var, class, def, interface, other]
        line:
          type: integer
        signature:
          type: string
        exported:
          type: boolean

    IndexedFile:
      type: object
      required: [path, language, size_bytes, line_count, sha256, indexed_at]
      properties:
        path:
          type: string
        language:
          type: string
        size_bytes:
          type: integer
        line_count:
          type: integer
        sha256:
          type: string
        indexed_at:
          type: string
          format: date-time

    ContextRefresh:
      type: object
      required: [workspace_id, query]
      properties:
        workspace_id:
          type: string
        query:
          type: string
          description: Search terms used to retrieve context.
        token_budget:
          type: integer
          enum: [32768, 131072, 262144]
        expand:
          type: boolean
          description: Expand the manifest with additional retrieval after the first pass.

    ContextManifest:
      type: object
      required: [id, workspace_id, query, strategy, token_budget, token_estimate, truncated, items, created_at]
      properties:
        id:
          type: string
        run_id:
          type: string
        workspace_id:
          type: string
        query:
          type: string
        strategy:
          type: string
          enum: [search, symbol, issue_files, expansion]
        token_budget:
          type: integer
        token_estimate:
          type: integer
        truncated:
          type: boolean
        omitted_paths:
          type: array
          items:
            type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContextItem'
        untrusted_notes:
          type: array
          items:
            type: string
          description: Notices stating that repository content is untrusted data.
        created_at:
          type: string
          format: date-time

    ContextItem:
      type: object
      required: [path, line_start, line_end, content, reason, token_estimate, sha256]
      properties:
        path:
          type: string
        line_start:
          type: integer
        line_end:
          type: integer
        content:
          type: string
        reason:
          type: string
          description: Why this range was retrieved.
        token_estimate:
          type: integer
        sha256:
          type: string

    PlanSubmission:
      type: object
      required: [base_sha, plan]
      properties:
        base_sha:
          type: string
          pattern: '^[0-9a-f]{40}$'
        context_sha256:
          type: string
        plan:
          $ref: '#/components/schemas/Plan'

    Plan:
      type: object
      required: [kind, risk, summary, base_sha, nodes, acceptance, hypotheses]
      properties:
        kind:
          type: string
          enum: [bug, feature, refactor, security]
        risk:
          type: string
          enum: [low, medium, high]
        summary:
          type: string
          minLength: 1
        base_sha:
          type: string
          pattern: '^[0-9a-f]{40}$'
        hypotheses:
          type: array
          minItems: 0
          items:
            type: object
            required: [statement, evidence]
            properties:
              statement:
                type: string
              evidence:
                type: array
                minItems: 1
                items:
                  type: string
        nodes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PlanNode'
        acceptance:
          type: array
          items:
            $ref: '#/components/schemas/AcceptanceCriterion'
        out_of_scope:
          type: array
          items:
            type: string
        assumptions:
          type: array
          items:
            type: string

    PlanNode:
      type: object
      required: [key, title, kind]
      properties:
        key:
          type: string
        title:
          type: string
        kind:
          type: string
          enum: [investigate, edit, test, verify, review]
        path:
          type: string
          description: Repository-relative path; required for edit nodes.
        line_hint:
          type: integer
        prerequisites:
          type: array
          items:
            type: string
        evidence:
          type: array
          items:
            type: string

    AcceptanceCriterion:
      type: object
      required: [key, description]
      properties:
        key:
          type: string
        description:
          type: string
        verification:
          type: string
          description: Command or check that proves the criterion.

    PlanView:
      type: object
      required: [id, run_id, revision, kind, risk, summary, status, nodes, acceptance, findings, created_at]
      properties:
        id:
          type: string
        run_id:
          type: string
        revision:
          type: integer
        kind:
          type: string
        risk:
          type: string
        summary:
          type: string
        status:
          type: string
          enum: [draft, awaiting_approval, approved, rejected, superseded]
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/PlanNode'
        acceptance:
          type: array
          items:
            $ref: '#/components/schemas/AcceptanceCriterion'
        findings:
          type: array
          items:
            type: object
            required: [severity, code, message]
            properties:
              severity:
                type: string
                enum: [error, warning]
              code:
                type: string
              message:
                type: string
        approvals:
          type: array
          items:
            type: object
            required: [revision, actor_id, decision, created_at]
            properties:
              revision:
                type: integer
              actor_id:
                type: string
              decision:
                type: string
                enum: [approved, rejected]
              reason:
                type: string
              created_at:
                type: string
        created_at:
          type: string

    PlanDecision:
      type: object
      required: [revision, decision]
      properties:
        revision:
          type: integer
          minimum: 1
        decision:
          type: string
          enum: [approve, reject]
        reason:
          type: string
          maxLength: 2000

    PatchSubmission:
      type: object
      required: [workspace_id, unified_diff]
      properties:
        workspace_id:
          type: string
        unified_diff:
          type: string
          minLength: 1

    PatchResult:
      type: object
      required: [attempt, paths]
      properties:
        attempt:
          $ref: '#/components/schemas/PatchAttempt'
        paths:
          type: array
          items:
            type: string

    PatchAttempt:
      type: object
      required: [id, path, action, before_sha256, after_sha256, hunks, created_at]
      properties:
        id:
          type: string
        path:
          type: string
        action:
          type: string
          enum: [modified, created, deleted, renamed]
        before_sha256:
          type: string
          description: Empty when the file did not exist.
        after_sha256:
          type: string
          description: Empty when the file was deleted.
        hunks:
          type: integer
        created_at:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/PatchFileResult'

    PatchFileResult:
      type: object
      required: [path, action, before_sha256, after_sha256, hunks]
      properties:
        path:
          type: string
        action:
          type: string
          enum: [modified, created, deleted, renamed]
        before_sha256:
          type: string
        after_sha256:
          type: string
        hunks:
          type: integer

    CheckRunRequest:
      type: object
      required: [workspace_id]
      properties:
        workspace_id:
          type: string
        profiles:
          type: array
          items:
            type: string
            enum: [go.test, go.build, go.vet, npm.test, npm.typecheck, npm.lint, lint.go, python.test]
          description: Profiles to run; defaults to every required profile.

    Check:
      type: object
      required: [id, run_id, profile, status, duration_ms, required, verdict, raw_log_sha256, created_at]
      properties:
        id:
          type: string
        run_id:
          type: string
        profile:
          type: string
        status:
          type: string
          enum: [passed, failed, rejected, timed_out, missing]
        exit_code:
          type: [integer, 'null']
        duration_ms:
          type: integer
        required:
          type: boolean
        verdict:
          type: string
          enum: [green, red, blocked]
        failure_groups:
          type: array
          items:
            $ref: '#/components/schemas/FailureGroup'
        raw_log_sha256:
          type: string
          description: Checksum of the bounded raw log for provenance.
        created_at:
          type: string
          format: date-time

    FailureGroup:
      type: object
      required: [message, kind]
      properties:
        path:
          type: string
        line:
          type: integer
        message:
          type: string
        kind:
          type: string
          enum: [test_failure, build_failure, lint, typecheck, sandbox]

    RecoverRequest:
      type: object
      properties:
        workspace_id:
          type: string
        class:
          type: string
          enum: [rate_limit, timeout, provider_server, provider_transport, provider_response, tool_error, patch_conflict, patch_rejected, test_failure, credential_expired, lease_lost, worker_lost, sse_interrupted, unknown]
        reason:
          type: string
        checkpoint_id:
          type: string

    RecoverResponse:
      type: object
      required: [run_id, attempt, budget, delay_ms, hypothesis]
      properties:
        run_id:
          type: string
        attempt:
          type: integer
        budget:
          type: object
          properties:
            run_id:
              type: string
            class:
              type: string
            allowed:
              type: integer
            used:
              type: integer
            exhaust:
              type: boolean
        delay_ms:
          type: integer
        hypothesis:
          $ref: '#/components/schemas/Hypothesis'

    Hypothesis:
      type: object
      properties:
        class:
          type: string
        rationale:
          type: string
        profiles:
          type: array
          items:
            type: string
        fingerprint:
          type: string

    RecoveryView:
      type: object
      required: [run_id, run_state, budgets, attempts, timeline, receipts, checkpoints, next_attempt]
      properties:
        run_id:
          type: string
        run_state:
          type: string
        budgets:
          type: array
          items:
            $ref: '#/components/schemas/RecoveryBudget'
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/RecoveryAttempt'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/RecoveryEvent'
        receipts:
          type: array
          items:
            $ref: '#/components/schemas/EffectReceipt'
        checkpoints:
          type: array
          items:
            $ref: '#/components/schemas/CheckpointSummary'
        next_attempt:
          type: integer

    RecoveryBudget:
      type: object
      properties:
        class:
          type: string
        allowed:
          type: integer
        used:
          type: integer
        remaining:
          type: integer
        exhausted:
          type: boolean

    RecoveryAttempt:
      type: object
      properties:
        run_id:
          type: string
        number:
          type: integer
        kind:
          type: string
          enum: [patched, noop, blocked]
        fingerprint:
          type: string
        patch_fingerprint:
          type: string
        failing_count:
          type: integer
        verdict:
          type: string
        note:
          type: string

    RecoveryEvent:
      type: object
      properties:
        id:
          type: string
        run_id:
          type: string
        kind:
          type: string
          enum: [retry_scheduled, retry_exhausted, loop_detected, blocked, recovered, rollback, lease_recovered, receipt_replayed, credential_refreshed]
        attempt:
          type: integer
        class:
          type: string
        reason:
          type: string
        evidence:
          type: object
          additionalProperties: true
        actor_type:
          type: string
        created_at:
          type: string
          format: date-time

    EffectReceipt:
      type: object
      properties:
        id:
          type: string
        run_id:
          type: string
        operation:
          type: string
        effect_id:
          type: string
        status:
          type: string
        result:
          type: object
          additionalProperties: true
        created_at:
          type: string

    CheckpointSummary:
      type: object
      properties:
        id:
          type: string
        run_id:
          type: string
        verdict:
          type: string
        file_count:
          type: integer
        created_at:
          type: string

    RollbackRequest:
      type: object
      required: [effect_id]
      properties:
        effect_id:
          type: string
          description: Unique effect identifier; the same id can never restore twice.
        checkpoint_id:
          type: string
          description: Snapshot to restore; when empty the newest snapshot is used.
        workspace_id:
          type: string
        reason:
          type: string

    RollbackResponse:
      type: object
      required: [run_id, checkpoint_id, restored_files, drift_before, drift_after, duplicate]
      properties:
        run_id:
          type: string
        checkpoint_id:
          type: string
        restored_files:
          type: array
          items:
            type: string
        drift_before:
          type: integer
        drift_after:
          type: integer
        receipt:
          $ref: '#/components/schemas/EffectReceipt'
        duplicate:
          type: boolean

    OpenPullRequestRequest:
      type: object
      required: [workspace_id, effect_id, head, title, repo_owner, repo_name, files, checks, commits]
      properties:
        workspace_id:
          type: string
        effect_id:
          type: string
          description: Unique effect identifier; the same id can never open two pull requests.
        head:
          type: string
        base:
          type: string
          description: Branch the change targets; defaults to main.
        title:
          type: string
        issue_number:
          type: integer
        repo_owner:
          type: string
        repo_name:
          type: string
        summary:
          type: string
        risks:
          type: array
          items:
            type: string
        secret_scan_clean:
          type: boolean
        pinned_sha:
          type: string
        base_sha:
          type: string
        files:
          type: array
          items:
            type: string
        checks:
          type: array
          items:
            $ref: '#/components/schemas/LocalCheck'
        commits:
          type: array
          items:
            $ref: '#/components/schemas/CommitSpec'

    LocalCheck:
      type: object
      required: [profile, verdict, ran]
      properties:
        profile:
          type: string
        verdict:
          type: string
          enum: [green, red]
        ran:
          type: boolean
        detail:
          type: string

    CommitSpec:
      type: object
      required: [message, paths]
      properties:
        message:
          type: string
        paths:
          type: array
          items:
            type: string

    PullRequestView:
      type: object
      properties:
        id:
          type: string
        run_id:
          type: string
        number:
          type: integer
        url:
          type: string
        repo_owner:
          type: string
        repo_name:
          type: string
        head_branch:
          type: string
        base_branch:
          type: string
        title:
          type: string
        body:
          type: string
        issue_number:
          type: integer
        state:
          type: string
          enum: [open, merged, closed, blocked, abandoned]
        checks:
          type: array
          items:
            $ref: '#/components/schemas/RemoteCheck'
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/RemoteReview'
        approval_count:
          type: integer
        merge_state:
          type: string
        blocked_reason:
          type: string
        merge_sha:
          type: string
        branch_deleted:
          type: boolean
        commits:
          type: array
          items:
            $ref: '#/components/schemas/ComposedCommit'
        created_at:
          type: string
        updated_at:
          type: string

    RemoteCheck:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum: [queued, in_progress, completed]
        conclusion:
          type: string
          enum: [success, failure, cancelled, skipped, neutral]
        details_url:
          type: string

    RemoteReview:
      type: object
      properties:
        author:
          type: string
        state:
          type: string
          enum: [approved, changes_requested, commented]
        commit_id:
          type: string

    ComposedCommit:
      type: object
      properties:
        sha:
          type: string
        message:
          type: string
        author:
          $ref: '#/components/schemas/CommitIdentity'
        committer:
          $ref: '#/components/schemas/CommitIdentity'
        files:
          type: array
          items:
            type: string
        created_at:
          type: string

    CommitIdentity:
      type: object
      properties:
        name:
          type: string
        email:
          type: string

    MergePullRequestBody:
      type: object
      required: [authorized_by]
      properties:
        authorized_by:
          type: string
          description: Permitted human authorizing the merge; a model or bot identity is refused.
        method:
          type: string
          description: GitHub merge method, for example merge or squash.
          default: merge
        effect_id:
          type: string

    MergeResult:
      type: object
      properties:
        run_id:
          type: string
        pull_request:
          $ref: '#/components/schemas/PullRequestView'
        merge_action:
          $ref: '#/components/schemas/MergeAction'
        merge_sha:
          type: string
        already_merged:
          type: boolean
        decision:
          $ref: '#/components/schemas/GateDecision'

    MergeAction:
      type: object
      properties:
        id:
          type: string
        run_id:
          type: string
        pull_request_id:
          type: string
        authorized_by:
          type: string
        method:
          type: string
        merge_sha:
          type: string
        succeeded:
          type: boolean
        outcome:
          type: string
        effect_id:
          type: string
        created_at:
          type: string

    GateDecision:
      type: object
      properties:
        allowed:
          type: boolean
        reasons:
          type: array
          items:
            type: string
        stage:
          type: string
          enum: [push, merge]

    AbandonRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    AbandonResult:
      type: object
      properties:
        run_id:
          type: string
        pull_request:
          $ref: '#/components/schemas/PullRequestView'
        abandoned:
          type: boolean

    DashboardView:
      type: object
      properties:
        organization_id:
          type: string
        runs_by_state:
          type: object
          additionalProperties:
            type: integer
        open_issues:
          type: integer
        blocked_runs:
          type: integer
        failed_runs:
          type: integer
        recent_audit_events:
          type: integer
        recent_runs:
          type: array
          items:
            $ref: '#/components/schemas/DashboardRun'
        generated_at:
          type: string
          format: date-time

    DashboardRun:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        project_name:
          type: string
        state:
          type: string
        attempt:
          type: integer
        created_at:
          type: string
          format: date-time

    PreferencesView:
      type: object
      properties:
        user_id:
          type: string
        view:
          type: object
          additionalProperties: true
        stored:
          type: boolean
        updated_at:
          type: string
          format: date-time

    PreferencesSaveRequest:
      type: object
      required: [view]
      properties:
        view:
          type: object
          additionalProperties: true

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true

  responses:
    GitHubError:
      description: GitHub refused or failed the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: github_permission_denied
              message: GitHub denied access with this installation
              request_id: req_0123456789abcdef
    BadRequest:
      description: Client-correctable request error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: validation_failed
              message: name is required
              request_id: req_0123456789abcdef
    Unauthorized:
      description: No authenticated subject.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthenticated
              message: authentication is required
              request_id: req_0123456789abcdef
    PermissionDenied:
      description: Subject lacks the required role for this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: permission_denied
              message: you do not have access to this organization
              request_id: req_0123456789abcdef
    NotFound:
      description: Resource does not exist (or is not visible to this subject).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: resource not found
              request_id: req_0123456789abcdef
    Conflict:
      description: Optimistic concurrency or uniqueness conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: version_mismatch
              message: project was modified by someone else
              request_id: req_0123456789abcdef
              details:
                current_version: 4
    InternalError:
      description: Unexpected server failure. The body never contains internal detail.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: internal_error
              message: internal server error
              request_id: req_0123456789abcdef

  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Correlation ID; echoed on the response and in server logs.
      schema:
        type: string
        maxLength: 128
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF token returned by login or refresh; required for
        cookie-authenticated mutations.
      schema:
        type: string
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required for create/update operations. Repeating a request with the
        same key returns the original result instead of duplicating effects.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor from a previous `next_cursor`.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Page size (1-100, default 20).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Query:
      name: q
      in: query
      required: false
      description: Case-insensitive name filter.
      schema:
        type: string
        maxLength: 120
